<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · WA Broadcast</title><link rel="stylesheet" href="/app.css"></head>
<body><main class="login"><form class="card" id="f" autocomplete="on">
  <div class="logo" style="padding:0 0 18px"><i>W</i>WA Broadcast</div>
  <h1 style="font-size:20px">Connexion</h1><p class="mute sm" style="margin:6px 0 20px">Accédez à votre espace de diffusion.</p>
  <div class="field"><label for="u">Identifiant</label><input id="u" name="username" autocomplete="username" required autofocus></div>
  <div class="field"><label for="p">Mot de passe</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
  <p class="err-text" id="e" role="alert"></p>
  <button class="btn primary" style="width:100%" id="go">Se connecter</button>
</form></main><script src="/login.js"></script></body></html>
